name: APK bauen

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Projekt laden
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: SDK-Pakete installieren
        run: yes | sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Gradle 9.6 einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Debug-APK bauen
        run: gradle :app:assembleDebug

      - name: APK als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: PVCompact-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
