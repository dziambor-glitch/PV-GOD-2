name: APK bauen

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Dateien laden
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Android-Projekt finden
        shell: bash
        run: |
          mkdir -p extracted

          ZIPFILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"

          if [ -n "$ZIPFILE" ]; then
            echo "ZIP gefunden: $ZIPFILE"
            unzip -o "$ZIPFILE" -d extracted
          else
            echo "Keine ZIP im Hauptordner gefunden – suche direkt im Repository."
          fi

          BUILD_FILE="$(find . -type f -path '*/app/build.gradle.kts' -print -quit)"

          if [ -z "$BUILD_FILE" ]; then
            echo "FEHLER: app/build.gradle.kts wurde nicht gefunden."
            echo "Vorhandene Dateien:"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          APP_DIR="$(dirname "$BUILD_FILE")"
          PROJECT_DIR="$(dirname "$APP_DIR")"

          echo "Android-Projekt gefunden: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "compileSdk wird auf Android 36 gesetzt."
          sed -E -i 's/compileSdk[[:space:]]*=[[:space:]]*[0-9]+/compileSdk = 36/' "$BUILD_FILE"

      - name: Android 36 installieren
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 9.6 einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Projekt anzeigen
        shell: bash
        run: |
          echo "Gebaut wird aus: $PROJECT_DIR"
          echo "Inhalt:"
          ls -la "$PROJECT_DIR"
          echo "App:"
          ls -la "$PROJECT_DIR/app"

      - name: APK bauen
        shell: bash
        run: |
          gradle -p "$PROJECT_DIR" :app:assembleDebug --stacktrace

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: PVCompact-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
