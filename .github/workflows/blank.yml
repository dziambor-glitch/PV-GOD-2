name: APK bauen

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Projekt entpacken
        shell: bash
        run: |
          rm -rf extracted
          mkdir -p extracted

          ZIPFILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"

          if [ -z "$ZIPFILE" ]; then
            echo "FEHLER: Keine ZIP-Datei gefunden."
            exit 1
          fi

          echo "ZIP gefunden: $ZIPFILE"
          unzip -o "$ZIPFILE" -d extracted

          BUILD_FILE="$(find extracted -type f -path '*/app/build.gradle.kts' -print -quit)"

          if [ -z "$BUILD_FILE" ]; then
            echo "FEHLER: Android-Projekt wurde nicht gefunden."
            find extracted -maxdepth 5 -type f | sort
            exit 1
          fi

          APP_DIR="$(dirname "$BUILD_FILE")"
          PROJECT_DIR="$(dirname "$APP_DIR")"

          echo "Android-Projekt gefunden: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "App-Builddatei:"
          cat "$BUILD_FILE"

          echo "Root-Builddatei:"
          cat "$PROJECT_DIR/build.gradle.kts"

      - name: Android SDK prüfen
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "Installierte Android-Plattformen:"
          ls -la "$ANDROID_HOME/platforms"

          echo "Installierte Build-Tools:"
          ls -la "$ANDROID_HOME/build-tools"

      - name: Gradle 9.6 einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: APK bauen
        shell: bash
        run: |
          echo "Baue aus: $PROJECT_DIR"
          gradle \
            -p "$PROJECT_DIR" \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: PVCompact-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
