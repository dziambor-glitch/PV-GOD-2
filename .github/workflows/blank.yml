name: APK bauen

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Projekt herunterladen und vorbereiten
        shell: bash
        run: |
          rm -rf /tmp/pvcompact
          rm -f /tmp/pvcompact.zip
          mkdir -p /tmp/pvcompact

          echo "PVCompact ZIP wird geladen..."

          curl --fail --location --retry 3 \
            -o /tmp/pvcompact.zip \
            "https://raw.githubusercontent.com/dziambor-glitch/PV-GOD/main/PVCompact-AndroidStudio-Forecast-APK-Build%20%281%29.zip"

          echo "ZIP wird entpackt..."
          unzip -q /tmp/pvcompact.zip -d /tmp/pvcompact

          PROJECT_DIR="/tmp/pvcompact/PVCompact"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "FEHLER: Android-Projekt wurde nicht gefunden."
            find /tmp/pvcompact -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "Projekt gefunden: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          # Android API 36 verwenden
          sed -E -i \
            's/compileSdk[[:space:]]*=[[:space:]]*[0-9]+/compileSdk = 36/' \
            "$PROJECT_DIR/app/build.gradle.kts"

          # AGP 9.1.1 verwenden
          sed -i \
            's/version "9.4.0"/version "9.1.1"/' \
            "$PROJECT_DIR/build.gradle.kts"

          # Externes Kotlin-Plugin mit alter DSL erlauben
          if ! grep -q '^android.newDsl=false' "$PROJECT_DIR/gradle.properties"; then
            echo 'android.newDsl=false' >> "$PROJECT_DIR/gradle.properties"
          fi

          echo "Build-Konfiguration:"
          cat "$PROJECT_DIR/build.gradle.kts"
          echo
          cat "$PROJECT_DIR/gradle.properties"

      - name: Android 36 installieren
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 9.3.1 einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: APK bauen
        shell: bash
        run: |
          echo "Baue Projekt aus: $PROJECT_DIR"
          gradle -p "$PROJECT_DIR" :app:assembleDebug --no-daemon --stacktrace

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: PVCompact-APK
          path: /tmp/pvcompact/PVCompact/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
